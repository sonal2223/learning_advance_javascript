<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //promise 1
        let p1= new  Promise((resolve) => {
            setTimeout(() => resolve ("Apple ready"), 3000);

        });
        let p2= new  Promise((resolve) => {
            setTimeout(() => resolve ("Banana ready"), 3000);

        });
        let p3= new  Promise((resolve) => {
            setTimeout(() => resolve ("Grapes ready"), 3000);

        });

        Promise.all([p1, p2,p3])
        .then(result => {
            document.write("<h3> All fruits are ready </h3>");
            result.forEach(item => document.write(item + "<br>"));
        })
        .catch(error =>{
           document.write("<h3> One or more promise failed</h3>");
        });


    </script>
</body>
</html>
