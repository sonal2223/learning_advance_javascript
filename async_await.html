<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h2> Async Await Example</h2>
    <pre id="output"></pre>
    <script>
        const output = document.getElementById("output");
         
        function log(msg){
            output.textContent += msg + "\n";
        }
        //boil water
        function boilWater(){
            return new Promise((resolve)  =>{
setTimeout (() => resolve ("Water Boiled..."),3000);
            });
        }

        function makeTea(){
            return new Promise((resolve)  =>{
setTimeout (() => resolve ("Tea is ready..."),3000);
            });
        }

        function toastBread(){
            return new Promise((resolve)  =>{
setTimeout (() => resolve ("bread tosted..."),3000);
            });
        }

        async function makeBreakfast(){
            try{
                const step1 =await boilWater();
                log("1" + step1);

                const step2 =await makeTea();
                log("2" + step2);

                const step3 =await toastBread();
                log("3" + step3);

                log ("All breakfast items are ready to eat");
            } catch (error) {
                log("Error Occured" + error);
            }
            finally{
                log("Breakfast preparation completed");
            }
        }

        log("kitchen Opened ");
        makeBreakfast();


    </script>
</body>
</html>
