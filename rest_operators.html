    <script>
       function add(...numbers){
        let sum=0;
        for (let i in numbers){
            sum +=numbers[i];

        }
        document.write(sum + "<br>");
       }
           add(12, 56, 67, 68);
           add(12,56, 67, 68, 90, 100, 200);
           add(12,56);
    </script>
