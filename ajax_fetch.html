
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Fetch JSON Example</title>
</head>
<body>

    <h2>AJAX Example Using Fetch Method - Load JSON File</h2>

    <button onclick="loadJSON()">Load JSON File</button>

    <div id="output"></div>

    <script>
        function loadJSON() {
            fetch("data.json")
                .then((response) => {
                    document.getElementById("output").innerHTML =
                        "HTTP Status Code: " + response.status + "<br>";

                    if (!response.ok) {
                        throw new Error("File not found...");
                    }

                    return response.json();
                })
                .then((data) => {
                    document.getElementById("output").innerHTML += `
                        <h3>JSON Loaded Successfully!</h3>
                        <b>Name:</b> ${data.name}<br>
                        <b>Age:</b> ${data.age}<br>
                        <b>City:</b> ${data.city}<br>
                        <b>Skills:</b> ${data.skills.join(", ")}
                    `;
                })
                .catch((error) => {
                    document.getElementById("output").innerHTML +=
                        `<p>Error: ${error.message}</p>`;
                });
        }
    </script>

</body>
</html>
