
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AJAX Example</title>
</head>
<body>

    <h2>Load Local Data</h2>

    <button onclick="loadText()">Load Text File</button>
    <button onclick="loadJSON()">Load JSON File</button>

    <pre id="ajaxData">Click a button to load data</pre>

    <script>
        // Load Text File
        function loadText() {
            var xhr = new XMLHttpRequest();

            xhr.open("GET", "file.txt", true);

            xhr.onload = function () {
                if (xhr.status == 200) {
                    document.getElementById("ajaxData").textContent =
                        xhr.responseText;
                } else {
                    document.getElementById("ajaxData").textContent =
                        "Error loading text file";
                }
            };

            xhr.onerror = function () {
                document.getElementById("ajaxData").textContent =
                    "Request failed";
            };

            xhr.send();
        }

        // Load JSON File
        function loadJSON() {
            var xhr = new XMLHttpRequest();

            xhr.open("GET", "data.json", true);

            xhr.onload = function () {
                if (xhr.status == 200) {
                    var data = JSON.parse(xhr.responseText);

                    document.getElementById("ajaxData").textContent =
                        JSON.stringify(data, null, 4);
                } else {
                    document.getElementById("ajaxData").textContent =
                        "Error loading JSON file";
                }
            };

            xhr.onerror = function () {
                document.getElementById("ajaxData").textContent =
                    "Request failed";
            };

            xhr.send();
        }
    </script>

</body>
</html>
