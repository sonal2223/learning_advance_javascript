<!DOCTYPE html>
<html lang="en">

    <body>
        <script>
        //1 function without parameter
        //--old style--
        function hello(){
            console.log(" Hello Student");
        }
        hello(); //Function call

        //--arrow funtion--
        const helloArrow = () => 
            console.log("Hello Student usign arrow ");
          helloArrow(); //Function call


        //2. Function with parameter
        //-- old style--
        function welcome(name){
            console.log("Welcome "+ name);
        }
        welcome("sakshi");

        //--Arrow function
        const welcomeArrow = (name) =>
        console.log(" using arrow - welcome" + name);
    welcomeArrow("shweta");

    //3. Function with multiple parameter
    //--old style--
    function add(a,b){
        console.log(a + b);
}
 add(10,80);

 //--arrow function
 const addArrow = (a,b) =>
 console.log( a + b);
 addArrow(50,60);


 //4.Function with return value
 //--old style--
 function addition(x, y){
    return x + y;
 }
 let result = addition(10, 20);
 console.log(result);

 //--arrow function
 const additionArrow =(x,y) =>{
 return x+y;
}
let result2=additionArrow(20,20);
console.log(result2);

//5.Function returning a string
//--old style--
function sayHello(name){
    return" Hello " + name;

}
console.log(sayHello("Sami"));

//--arrow function
const sayHelloArrow =(name) => "Hello " + name;
console.log(sayHelloArrow("Sonal")); 

//6.Arrow Function with single Template Literal
const fulname = (fname, lname) => ` ${fname} ${lname}`;
console.log(fulname("nandu","Chiku"));

//7.Multiple statemens in Arrow Function 
// -- old style --
function calculate(a,b){    
let sum = a+b;
let result = sum*2;
return result;

}
console.log(calculate(10,20));

//--arrow function--
const calculateArrow =(a,b) => {
    let sum= a+b;
    let result = sum * 2;
    return result ;
};
console.log(calculateArrow(5,10));

//8. Arrow function returning an object 
const getStudent = () =>({
    name: "Pratiksha",
    address:"pune",
    position:"Developer"

});
console.log(getStudent());
     

// Arrow function = A shorter way of writing a function expression using =>
    </script>
    </body>
