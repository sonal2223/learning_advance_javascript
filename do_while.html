<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
    //Defination : do ..while loop execute the code at least once even if the condition is false
    //The condition is checked after executing 
    let i=10;
    do{
        console.log("Hello js");
        i++;
    }
    while(i<=5);
</script>
</body>
</html>
