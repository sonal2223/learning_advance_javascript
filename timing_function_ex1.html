<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- setTimeout- Executes code after delay
    syntax= setTimeout(function, delay); -->

    <button onclick="showmessage()">Click Me</button>
    <script>
        function showmessage(){
            document.write("please wait...");

            setTimeout(function (){
                document.write("<br> Hello Students");
            }, 5000);
        }
    </script>

    <p id="message">Waiting for message...</p>
    <script>
        setTimeout(function (){
            document.getElementById("message").textContent="welcome to js";

        },4000);
    </script>

    <!-- setInterval-Execute code repeately
    syntax=setInterval(function, interval); -->

    <script>
        setInteval(function (){
            console.log ("Hello student welcome interval eaxmple");
        },3000);
    </script>

    <h1>Counter Examples</h1>
    <h2>Counter: <span id="count">0</span></h2>

    <script>
        let count = 0;

        setInterval(function() {
            count++;
            document.getElementById("count").innerHTML = count;
        }, 1000);
    </script>
</body>
</html>
