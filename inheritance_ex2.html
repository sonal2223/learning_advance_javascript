<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //parent class
        class person{
            constructor(name, age){
                this.name =name;
                this.age = age;
            }
        showInfo(){
            document.write(`<h1> Person Info: </h1> - Name: ${this.name} <br> Age: ${this.age}<br>`);

        }
    }
//child class
class student extends person{
    constructor(name, age,rollNo){
        super(name, age);
        this.rollNo
    }
    showStudent(){
         document.write(`<h1> Student Info: </h1> - Name: ${this.name} <br> Age: ${this.age}<br>, RollNo: ${this.rollNo}`);
    }
}

class GraduateStudent extends student{
    constructor(name, age, rollNo, degree){
        super(name, age, rollNo);
        this.degree = degree;

    }
    showGraduate(){
        document.write(`<br> Degree -${this.degree}`);
    }
}

    </script>
    
</body>
</html>
