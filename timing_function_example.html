<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- ClearTimeout- cancle a schedule timeout -->
    <h2>Cancle timeout Example</h2>
    <button onclick="startTimer()">Start Timer</button>

    <button onclick="cancleTimer()">Cancle Timer</button>
    <p id="message2">Click Star Timer...</p>
    <script>
        let timerId;
        function startTimer(){
            timerId= setTimeout(function (){
                document.getElementById("message2").textContent="Hello Students...";
            }, 10000);
        }

        function cancleTimer(){
            clearTimeout(timerId);
            document.getElementById("message2").textContent="Timer Cancelled";
        }
    </script>

    <!-- ClearInterval()-stop repeated Execution -->
     <h2>Counter: <span id="count">0</span></h2>

    <button onclick="startCounter()">Start</button>
    <button onclick="stopCounter()">Stop</button>

    <script>
        let count = 0;
        let intervalId = null;

        function startCounter() {
            if (intervalId !== null) {
                return;
            }

            intervalId = setInterval(function () {
                count++;
                document.getElementById("count").textContent = count;
            }, 1000);
        }

        function stopCounter() {
            clearInterval(intervalId);
            intervalId = null;
        }
    </script>

    <h2>Current Time: <span id="time"></span></h2>
    <p id="time"> </p>
    <script>
        function showTime() {
            let time = new Date();
            document.getElementById("time").textContent =
                time.toLocaleTimeString();
        }

        showTime();

        setInterval(showTime, 1000);
    </script>
   
   

</body>
</html>
